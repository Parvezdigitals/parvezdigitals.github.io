<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Maker - Parvez Digitals</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui;padding:10px}
.box{max-width:420px;margin:auto;background:#222;border-radius:18px;padding:16px}
input[type=file]{width:100%;background:#fff;color:#000;padding:14px;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px}
img{width:100%;border-radius:14px;margin-top:12px;display:none;background:#fff}
button{width:100%;padding:13px;border-radius:12px;border:none;font-weight:800;margin-top:10px;font-size:16px}
.active{outline:3px solid #00ff88}
</style>
</head>
<body>
<div class="box">
<h3 style="text-align:center">📸 Parvez Digitals</h3>

<!-- FIXED UPLOAD - সরাসরি দেখা যাবে -->
<input type="file" id="fileInput" accept="image/*">

<img id="preview">

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
<button style="background:#fff" id="b1" onclick="setBg('#ffffff','b1')">সাদা</button>
<button style="background:#a3d5ff" id="b2" onclick="setBg('#a3d5ff','b2')">ব্লু</button>
<button style="background:#1976d2;color:#fff" id="b3" onclick="setBg('#1976d2','b3')">ডিপ ব্লু</button>
</div>

<button style="background:#fff;color:#000" onclick="make()">✨ পাসপোর্ট বানাও</button>

<canvas id="c" width="800" height="1000" style="display:none"></canvas>
<img id="result">
<a id="dl" download="passport.jpg"><button id="dlBtn" style="display:none;background:#00ff88;color:#000">⬇️ ডাউনলোড</button></a>

<p id="st" style="text-align:center;color:#0f8;margin-top:10px">ছবি বাছো</p>
</div>

<script>
let imgObj=null, bg='#ffffff';
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const result=document.getElementById('result');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

fileInput.addEventListener('change',function(){
  const file=this.files[0];
  if(!file){document.getElementById('st').innerText='ফাইল পাওয়া যায়নি';return;}
  const reader=new FileReader();
  reader.onload=function(e){
    preview.src=e.target.result;
    preview.style.display='block';
    imgObj=new Image();
    imgObj.onload=function(){
      document.getElementById('st').innerText='✅ লোড হয়েছে, বানাও তে ক্লিক করো';
    };
    imgObj.src=e.target.result;
  };
  reader.readAsDataURL(file);
});

function setBg(c,id){
  bg=c;
  document.querySelectorAll('[id^=b]').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(result.style.display==='block') make();
}
function make(){
  if(!imgObj){alert('আগে ছবি বাছো');return;}
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,800,1000);
  ctx.filter='contrast(1.1) brightness(1.07) saturate(1.05)';
  ctx.drawImage(imgObj,40,10,720,970);
