<script>
let imgObj=null, bg='#ffffff';
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const result=document.getElementById('result');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

fileInput.addEventListener('change',function(){
  const file=this.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    preview.src=e.target.result;
    preview.style.display='block';
    imgObj=new Image();
    imgObj.src=e.target.result;
    imgObj.onload=()=>{ document.getElementById('st').innerText='✅ লোড হয়েছে, এখন বানাও তে ক্লিক করো'; }
  };
  reader.readAsDataURL(file);
});

function setBg(c,id){
  bg=c;
  document.querySelectorAll('[id^=b]').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(result.style.display==='block') make();
}
function make(){
  if(!imgObj){alert('আগে ছবি বাছো');return;}
  ctx.clearRect(0,0,800,1000);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,800,1000);
  ctx.drawImage(imgObj,40,10,720,970);
  const url=canvas.toDataURL('image/jpeg',0.92);
  result.src=url;
  result.style.display='block';
  document.getElementById('dl').href=url;
  document.getElementById('dlBtn').style.display='block';
  document.getElementById('st').innerText='✅ রেডি! ডাউনলোড করো';
}
document.getElementById('b1').classList.add('active');
</script>
