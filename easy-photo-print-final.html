<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Maker PRO - Parvez Digitals</title>
<style>
*{box-sizing:border-box}
body{margin:0; background:#0f0f0f; color:#fff; font-family:system-ui; padding:12px}
.app{max-width:430px; margin:auto; background:#1e1e1e; border-radius:20px; padding:18px; border:1px solid #333}
h2{text-align:center; margin:5px 0}
.upload{border:2px dashed #888; border-radius:15px; padding:30px 15px; text-align:center; background:#252525; cursor:pointer}
#preview, #result{width:100%; border-radius:15px; margin-top:15px; display:none; background:#fff}
.btn{width:100%; padding:14px; border:none; border-radius:12px; font-weight:800; font-size:16px; margin-top:12px}
.bg-opt{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px}
.bg-opt button{padding:12px; border-radius:10px; border:1px solid #555; font-weight:700; color:#000}
.status{text-align:center; color:#00ff88; margin-top:12px; font-size:14px}
</style>
</head>
<body>
<div class="app">
<h2>📸 Parvez Digitals Passport</h2>
<div class="upload" id="uploadBox">
<div style="font-size:38px">📁</div>
<p>এখানে টাচ করে ছবি আপলোড করো</p>
<img id="preview">
</div>
<input type="file" id="file" accept="image/*" style="display:none">

<div class="bg-opt">
<button style="background:#fff" onclick="changeBg('#ffffff')">সাদা</button>
<button style="background:#a3d5ff" onclick="changeBg('#a3d5ff')">হালকা ব্লু</button>
<button style="background:#1976d2; color:#fff" onclick="changeBg('#1976d2')">ডিপ ব্লু</button>
</div>

<button class="btn" style="background:#fff; color:#000" id="makeBtn">✨ HD Passport বানাও</button>

<canvas id="canvas" style="display:none"></canvas>
<img id="result">
<a id="downloadLink" download="passport_hd.jpg" style="text-decoration:none">
<button class="btn" id="dlBtn" style="background:#00ff88; color:#000; display:none">⬇️ ডাউনলোড করো (HD)</button>
</a>
<div class="status" id="status">ছবি সিলেক্ট করো</div>
</div>

<script>
let selectedImg = null;
let bgColor = "#ffffff";
const fileInput = document.getElementById('file');
const uploadBox = document.getElementById('uploadBox');
const preview = document.getElementById('preview');
const result = document.getElementById('result');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const dlBtn = document.getElementById('dlBtn');
const downloadLink = document.getElementById('downloadLink');

uploadBox.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if(!file){ status.innerText="ছবি পাওয়া যায়নি"; return; }
  if(!file.type.startsWith('image/')){ alert("শুধু ছবি আপলোড করো"); return; }

  const reader = new FileReader();
  reader.onload = (ev) => {
    preview.src = ev.target.result;
    preview.style.display = "block";
    selectedImg = new Image();
    selectedImg.onload = () => {
      status.innerText = "✅ ছবি লোড হয়েছে, এখন HD বানাও তে ক্লিক করো";
    }
    selectedImg.src = ev.target.result;
  }
  reader.readAsDataURL(file);
};

function changeBg(color){
  bgColor = color;
  if(selectedImg) makePassport();
}
