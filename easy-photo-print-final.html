<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Photo Print - Parvez Digital Service</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f4f8;color:#222}
header{background:#0b5ed7;color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:bold}
.container{max-width:520px;margin:15px auto;padding:15px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
button{width:100%;padding:12px;margin:8px 0;border:0;border-radius:8px;background:#0b5ed7;color:#fff;font-size:16px}
button:disabled{background:#aaa}
select,input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
#preview{width:100%;min-height:200px;border:2px dashed #ccc;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
#preview img,#preview canvas{max-width:100%}
.row{display:flex;gap:8px}.row button{flex:1}
.status{font-size:14px;color:#555;margin:8px 0;min-height:20px}
</style>
</head>
<body>
<header>Easy Photo Print</header>
<div class="container">
<div id="preview"><span style="color:#999">Photo select koro</span></div>
<div class="status" id="status"></div>
<input type="file" id="upload" accept="image/*">
<select id="bg">
<option value="white">Background: White</option>
<option value="#cfe8ff">Background: Lite Blue</option>
<option value="#87ceeb">Background: Sky Blue</option>
<option value="transparent">Background: Transparent</option>
</select>
<select id="size">
<option value="passport">Passport - 3.5x4.5cm</option>
<option value="visa">Visa - 5x5cm</option>
<option value="4r">4R - 4x6 inch</option>
</select>
<button id="removeBtn" disabled>1. Background Remove</button>
<div class="row">
<button id="enhanceBtn" disabled>2. HD Enhance</button>
<button id="downloadBtn" disabled>3. Download</button>
</div>
</div>
<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
const upload=document.getElementById('upload');
const preview=document.getElementById('preview');
const status=document.getElementById('status');
const removeBtn=document.getElementById('removeBtn');
const enhanceBtn=document.getElementById('enhanceBtn');
const downloadBtn=document.getElementById('downloadBtn');
const bgSel=document.getElementById('bg');
let origImg=null, cutImg=null, finalCanvas=null;

upload.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  const img=new Image(); img.onload=()=>{
    origImg=img; preview.innerHTML=''; preview.appendChild(img);
    status.textContent='Photo load hoyeche. Ebar Background Remove chap dao.';
    removeBtn.disabled=false; enhanceBtn.disabled=true; downloadBtn.disabled=true;
  }; img.src=url;
};

function drawOnBg(foreground, bgColor){
  const w=foreground.width, h=foreground.height;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  if(bgColor!=='transparent'){ ctx.fillStyle=bgColor; ctx.fillRect(0,0,w,h); }
  ctx.drawImage(foreground,0,0);
  return c;
}

removeBtn.onclick=async()=>{
  if(!origImg) return;
  try{
    status.textContent='Background remove hochche... ektu wait koro';
    removeBtn.disabled=true;
    // proper person segmentation, head cut hobe na
    const blob=await removeBackground(origImg.src,{output:{format:'image/png',quality:1}});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      cutImg=img;
      finalCanvas=drawOnBg(cutImg, bgSel.value);
      preview.innerHTML=''; preview.appendChild(finalCanvas);
      status.textContent='Background remove done. Ebar HD Enhance korte paro.';
      enhanceBtn.disabled=false; downloadBtn.disabled=false; removeBtn.disabled=false;
    };
    img.src=url;
  }catch(err){
    console.error(err);
    status.textContent='Background remove fail korlo. Onno photo try koro.';
    removeBtn.disabled=false;
  }
};

bgSel.onchange=()=>{
  if(!cutImg) return;
  finalCanvas=drawOnBg(cutImg, bgSel.value);
  preview.innerHTML=''; preview.appendChild(finalCanvas);
};

// simple HD enhance - contrast + sharpness
enhanceBtn.onclick=()=>{
  if(!finalCanvas) return;
  status.textContent='Enhance hochche...';
  const ctx=finalCanvas.getContext('2d');
  const id=ctx.getImageData(0,0,finalCanvas.width,finalCanvas.height);
  const d=id.data;
  for(let i=0;i<d.length;i+=4){
    d[i]=Math.min(255,d[i]*1.05+5);
    d[i+1]=Math.min(255,d[i+1]*1.05+5);
    d[i+2]=Math.min(255,d[i+2]*1.05+5);
  }
  ctx.putImageData(id,0,0);
  preview.innerHTML=''; preview.appendChild(finalCanvas);
  status.textContent='HD Enhance done. Ebar Download koro.';
};

downloadBtn.onclick=()=>{
  if(!finalCanvas) return;
  const a=document.createElement('a');
  a.download='easy-photo-print.png';
  a.href=finalCanvas.toDataURL('image/png');
  a.click();
  status.textContent='Download hoye geche.';
};
</script>

</html>
