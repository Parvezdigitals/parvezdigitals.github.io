<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Print AI Final</title>
<script type="importmap">{"imports":{"@imgly/background-removal":"https://unpkg.com/@imgly/background-removal@1.4.5/dist/index.js"}}</script>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;padding:10px}
.box{max-width:420px;margin:auto;background:#1e293b;border:2px solid #22c55e;border-radius:16px;padding:14px}
h2{text-align:center;color:#4ade80;margin:0;font-size:16px}
#st{text-align:center;color:#fbbf24;font-size:13px;font-weight:700;margin:8px}
canvas{width:100%;border-radius:12px;background:#8AB4F8}
.btn{width:100%;padding:14px;border-radius:10px;border:0;font-weight:900;margin-top:8px;font-size:15px}
</style>
</head>
<body>
<div class="box">
<h2>✅ AI Passport - Final</h2>
<input type="file" id="f" accept="image/*">
<p id="st">ছবি বাছো - AI 5 সেকেন্ডে বানাবে</p>
<canvas id="c" width="600" height="800"></canvas>
<button class="btn" style="background:#22c55e" onclick="downloadJPG()">⬇️ ডাউনলোড JPG</button>
</div>
<script type="module">
import {removeBackground} from "@imgly/background-removal";
const c=document.getElementById('c'), ctx=c.getContext('2d'), st=document.getElementById('st');
document.getElementById('f').onchange=async e=>{
 const file=e.target.files[0]; if(!file) return;
 st.innerText="⏳ AI কাজ করছে... 5 সেকেন্ড";
 try{
  const blob=await removeBackground(file);
  const img=new Image(); img.src=URL.createObjectURL(blob);
  img.onload=()=>{
   ctx.clearRect(0,0,600,800);
   ctx.fillStyle='#8AB4F8'; ctx.fillRect(0,0,600,800);
   ctx.fillStyle='#fff'; ctx.fillRect(0,540,600,260);
   ctx.beginPath();ctx.moveTo(170,540);ctx.lineTo(270,620);ctx.lineTo(220,560);ctx.fill();
   ctx.beginPath();ctx.moveTo(430,540);ctx.lineTo(330,620);ctx.lineTo(380,560);ctx.fill();
   // person center
   const scale=Math.min(500/img.width, 600/img.height);
   const w=img.width*scale, h=img.height*scale;
   ctx.drawImage(img, (600-w)/2, 20, w, h);
   st.innerText="✅ রেডি - একদম পারফেক্ট";
  };
 }catch(err){ st.innerText="❌ আবার চেষ্টা করো"; console.error(err); }
};
window.downloadJPG=()=>{
 const a=document.createElement('a'); a.download='passport-ai.jpg'; a.href=c.toDataURL('image/jpeg',0.92); a.click();
}
</script>
</body>
</html>
