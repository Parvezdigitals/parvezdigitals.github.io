<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PARVEZ DIGITAL SERVICE - Photo Enhancer</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0d1629;color:#fff;font-family:Arial,"Noto Sans Bengali",sans-serif;
}
header{
  position:sticky;top:0;z-index:5;background:#0d1629;
  border-bottom:1px solid #17233a;padding:14px 16px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:52px;height:52px;border-radius:50%;background:#050914;
  border:2px solid #f7b500;display:flex;align-items:center;justify-content:center;
  color:#f7b500;font-weight:900;font-size:14px;text-align:center;
}
.brand h1{font-size:19px;margin:0;color:#fff}
.brand p{margin:4px 0 0;color:#f7b500;font-size:12px;font-weight:bold}
.wrap{max-width:900px;margin:auto;padding:18px 14px 35px}
.card{
  background:#111d31;border:2px solid #f7b500;border-radius:18px;
  padding:16px;margin-bottom:16px;box-shadow:0 8px 25px #0005;
}
h2{margin:0 0 12px;color:#f7b500;font-size:21px}
.upload{
  display:block;background:#2563eb;border-radius:13px;padding:15px;
  text-align:center;font-size:18px;font-weight:bold;cursor:pointer;
}
.upload input{display:none}
.preview{
  width:100%;max-height:65vh;object-fit:contain;background:#07101e;
  border-radius:14px;border:1px solid #334155;display:block;margin-top:14px;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.control{
  background:#1a2940;border-radius:12px;padding:12px;margin-top:10px;
}
.control label{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}
input[type=range]{width:100%;accent-color:#f7b500}
button{
  width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;
  font-size:17px;font-weight:800;cursor:pointer;
}
.primary{background:#f7b500;color:#111}
.green{background:#16a34a;color:#fff}
.gray{background:#334155;color:#fff}
.status{color:#22c55e;text-align:center;min-height:22px;margin-top:8px;font-weight:bold}
.small{font-size:12px;color:#94a3b8;line-height:1.5}
.hidden{display:none}
@media(max-width:600px){
  .row{grid-template-columns:1fr}
  .brand h1{font-size:17px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">PA<br>PARVEZ</div>
    <div>
      <h1>PARVEZ DIGITAL SERVICE</h1>
      <p>📸 PHOTO ENHANCER • HD QUALITY</p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h2>📸 HD Photo Enhancer</h2>
    <label class="upload">
      📁 ছবি নির্বাচন করুন
      <input id="file" type="file" accept="image/*">
    </label>

    <div id="status" class="status"></div>

    <canvas id="canvas" class="preview hidden"></canvas>
  </div>

  <div id="controls" class="card hidden">
    <h2>✨ Photo Enhancement</h2>

    <div class="row">
      <div class="control">
        <label>☀️ Brightness <span id="bv">0</span></label>
        <input id="brightness" type="range" min="-30" max="30" value="0">
      </div>
      <div class="control">
        <label>◐ Contrast <span id="cv">1.00</span></label>
        <input id="contrast" type="range" min="0.7" max="1.4" step="0.01" value="1">
      </div>
      <div class="control">
        <label>🎨 Saturation <span id="sv">1.00</span></label>
        <input id="saturation" type="range" min="0.7" max="1.3" step="0.01" value="1">
      </div>
      <div class="control">
        <label>✨ Smooth <span id="smv">15</span></label>
        <input id="smooth" type="range" min="0" max="35" value="15">
      </div>
      <div class="control">
        <label>🔍 Sharpness <span id="shv">15</span></label>
        <input id="sharp" type="range" min="0" max="40" value="15">
      </div>
      <div class="control">
        <label>📐 Upscale <span id="uv">2×</span></label>
        <select id="upscale" style="width:100%;padding:10px;margin-top:7px;border-radius:8px">
          <option value="1">1×</option>
          <option value="2" selected>2× HD</option>
          <option value="3">3× HD</option>
          <option value="4">4× HD</option>
        </select>
      </div>
    </div>

    <button class="primary" id="enhance">✨ APPLY ENHANCEMENT</button>
    <button class="green" id="download">⬇️ DOWNLOAD HD PHOTO</button>
    <button class="gray" id="reset">↻ RESET</button>

    <p class="small">
      নোট: এই ভার্সনটি পুরোপুরি browser-এর ভিতরে কাজ করে। ছবি কোনো server-এ পাঠানো হয় না।
      খুব বড় ছবি হলে মোবাইলের RAM অনুযায়ী 4× upscale ধীর হতে পারে।
    </p>
  </div>
</main>

<script>
const fileInput=document.getElementById("file");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const controls=document.getElementById("controls");
const status=document.getElementById("status");

let sourceImage=null;

const $=id=>document.getElementById(id);

function clamp(v){return Math.max(0,Math.min(255,v));}

function updateLabels(){
  $("bv").textContent=$("brightness").value;
  $("cv").textContent=Number($("contrast").value).toFixed(2);
  $("sv").textContent=Number($("saturation").value).toFixed(2);
  $("smv").textContent=$("smooth").value;
  $("shv").textContent=$("sharp").value;
  $("uv").textContent=$("upscale").value+"×";
}
["brightness","contrast","saturation","smooth","sharp","upscale"].forEach(id=>{
  $(id).addEventListener("input",updateLabels);
});
updateLabels();

fileInput.addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      sourceImage=img;
      controls.classList.remove("hidden");
      canvas.classList.remove("hidden");
      status.textContent="ছবি লোড হয়েছে ✓";
      render();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

function render(){
  if(!sourceImage)return;

  const scale=Number($("upscale").value);
  const maxPixels=12000000; // mobile safety
  let w=sourceImage.naturalWidth*scale;
  let h=sourceImage.naturalHeight*scale;
  if(w*h>maxPixels){
    const k=Math.sqrt(maxPixels/(w*h));
    w=Math.floor(w*k);h=Math.floor(h*k);
    status.textContent="মোবাইল memory-এর জন্য output size সামান্য কমানো হয়েছে";
  }

  canvas.width=w;canvas.height=h;
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(sourceImage,0,0,w,h);

  let data=ctx.getImageData(0,0,w,h);
  let p=data.data;

  const brightness=Number($("brightness").value);
  const contrast=Number($("contrast").value);
  const saturation=Number($("saturation").value);

  // Basic tone + saturation correction
  for(let i=0;i<p.length;i+=4){
    let r=p[i],g=p[i+1],b=p[i+2];

    r=(r-128)*contrast+128+brightness;
    g=(g-128)*contrast+128+brightness;
    b=(b-128)*contrast+128+brightness;

    const gray=0.299*r+0.587*g+0.114*b;
    r=gray+(r-gray)*saturation;
    g=gray+(g-gray)*saturation;
    b=gray+(b-gray)*saturation;

    p[i]=clamp(r);p[i+1]=clamp(g);p[i+2]=clamp(b);
  }

  ctx.putImageData(data,0,0);

  // Gentle smoothing
  const smooth=Number($("smooth").value);
  if(smooth>0){
    const temp=document.createElement("canvas");
    temp.width=w;temp.height=h;
    const t=temp.getContext("2d");
    t.filter=`blur(${Math.max(0.2,smooth/10)}px)`;
    t.drawImage(canvas,0,0);
    ctx.globalAlpha=Math.min(0.45,smooth/100);
    ctx.drawImage(temp,0,0);
    ctx.globalAlpha=1;
  }

  // Unsharp-style sharpening
  const sharp=Number($("sharp").value);
  if(sharp>0){
    const original=ctx.getImageData(0,0,w,h);
    const blurred=document.createElement("canvas");
    blurred.width=w;blurred.height=h;
    const bc=blurred.getContext("2d");
    bc.filter="blur(1px)";
    bc.drawImage(canvas,0,0);
    const bp=bc.getImageData(0,0,w,h).data;
    const op=original.data;
    const amount=sharp/100;

    for(let i=0;i<op.length;i+=4){
      op[i]=clamp(op[i]+(op[i]-bp[i])*amount);
      op[i+1]=clamp(op[i+1]+(op[i+1]-bp[i+1])*amount);
      op[i+2]=clamp(op[i+2]+(op[i+2]-bp[i+2])*amount);
    }
    ctx.putImageData(original,0,0);
  }

  status.textContent="Enhancement complete ✓";
}

$("enhance").addEventListener("click",render);

$("download").addEventListener("click",()=>{
  if(!sourceImage){
    alert("আগে একটি ছবি নির্বাচন করুন");
    return;
  }
  canvas.toBlob(blob=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="PARVEZ_DIGITAL_ENHANCED_HD.jpg";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },"image/jpeg",0.97);
});

$("reset").addEventListener("click",()=>{
  $("brightness").value=0;
  $("contrast").value=1;
  $("saturation").value=1;
  $("smooth").value=15;
  $("sharp").value=15;
  $("upscale").value=2;
  updateLabels();
  render();
});
</script>
</body>
</html>
