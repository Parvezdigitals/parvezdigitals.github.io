<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Auto Passport - Parvez Digitals</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui;padding:12px}
.box{max-width:400px;margin:0 auto;background:#222;padding:16px;border-radius:18px}
input{width:100%;padding:16px;background:#fff;color:#000;border-radius:12px;font-size:17px;font-weight:bold}
img{width:100%;border-radius:14px;margin-top:12px;background:#fff}
button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h3 style="text-align:center">📸 Parvez Digitals FINAL</h3>

<input type="file" id="fileInput" accept="image/*">
<p id="msg" style="text-align:center;color:#0f8">গ্যালারি থেকে ছবি বাছো</p>

<img id="preview" style="display:none">
<canvas id="canvas" width="800" height="1000" style="display:none"></canvas>
<img id="final" style="display:none">

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px">
<button style="background:#fff" onclick="bg='#ffffff';make()">সাদা</button>
<button style="background:#8ec8ff" onclick="bg='#a3d5ff';make()">ব্লু</button>
<button style="background:#0d5cb6;color:#fff" onclick="bg='#1976d2';make()">ডিপ ব্লু</button>
</div>

<a id="dlink" download="passport.jpg"><button id="dbtn" style="display:none;background:#00ff88;margin-top:12px">⬇️ ডাউনলোড করো</button></a>
</div>

<script>
let img = null;
let bg = '#ffffff';
const inp = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const finalImg = document.getElementById('final');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

inp.onchange = function(){
  let f = this.files[0];
  if(!f) return;
  document.getElementById('msg').innerText = 'লোড হচ্ছে...';
  let r = new FileReader();
  r.onload = function(e){
    preview.src = e.target.result;
    preview.style.display = 'block';
    img = new Image();
    img.onload = function(){ make(); };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
};

function make(){
  if(!img) return;
  document.getElementById('msg').innerText = 'বানানো হচ্ছে...';
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,800,1000);
  ctx.drawImage(img, 0, 0, 800, 1000);
  let url = canvas.toDataURL('image/jpeg', 0.9);
  finalImg.src = url;
  finalImg.style.display = 'block';
  document.getElementById('dlink').href = url;
  document.getElementById('dbtn').style.display = 'block';
  document.getElementById('msg').innerText = '✅ হয়ে গেছে, ডাউনলোড করো';
}
</script>
</body>
</html>
