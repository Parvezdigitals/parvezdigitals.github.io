<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parvez Digitals - AI Passport Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui;padding:12px}
.app{max-width:440px;margin:auto;background:#1e1e1e;border-radius:22px;padding:18px;border:1px solid #333}
h2{text-align:center}
#fileInput{width:100%;background:#fff;color:#000;padding:14px;border-radius:12px;font-size:16px;font-weight:800}
#preview,#result{width:100%;border-radius:14px;margin-top:12px;display:none;background:#fff}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:12px;font-size:16px}
.bg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.bg button{padding:12px;border-radius:10px;border:3px solid transparent;font-weight:800}
.active{border-color:#00ff88!important;transform:scale(1.05)}
#status{text-align:center;color:#00ff88;margin-top:12px}
.loader{border:3px solid #333;border-top:3px solid #00ff88;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;margin:10px auto;display:none}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
<h2>📸 Parvez Digitals AI</h2>
<input type="file" id="fileInput" accept="image/*">
<img id="preview">
<div class="loader" id="loader"></div>
<div id="status">গ্যালারি থেকে ছবি বাছো</div>

<div class="bg">
<button id="b1" style="background:#fff" onclick="setBg('#ffffff','b1')">সাদা</button>
<button id="b2" style="background:#a3d5ff" onclick="setBg('#a3d5ff','b2')">হালকা ব্লু</button>
<button id="b3" style="background:#1976d2;color:#fff" onclick="setBg('#1976d2','b3')">ডিপ ব্লু</button>
</div>

<canvas id="canvas" width="800" height="1000" style="display:none"></canvas>
<img id="result">
<a id="dl" download="passport_hd_parvez.jpg"><button id="dlBtn" class="btn" style="display:none;background:#00ff88;color:#000">⬇️ HD ডাউনলোড</button></a>
</div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm";

let originalBlob = null;
let cutoutImg = null;
let bgColor = "#ffffff";

const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const result = document.getElementById('result');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const loader = document.getElementById('loader');

fileInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  originalBlob = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  status.innerText = '⏳ AI ব্যাকগ্রাউন্ড কাটছে... 10 সেকেন্ড লাগবে';
  loader.style.display = 'block';

  try{
    // AI Remove Background
    const blob = await removeBackground(file);
    const url = URL.createObjectURL(blob);
    cutoutImg = new Image();
    cutoutImg.onload = ()=>{ loader.style.display='none'; make(); };
    cutoutImg.src = url;
  }catch(err){
    loader.style.display='none';
    status.innerText = '❌ AI Fail, তবুও বানিয়ে দিচ্ছি';
    // Fallback
    cutoutImg = new Image();
    cutoutImg.src = URL.createObjectURL(file);
    cutoutImg.onload = make;
  }
});

window.setBg = function(c,id){
  bgColor=c;
  document.querySelectorAll('.bg button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(cutoutImg) make();
}

window.make = function(){
  if(!cutoutImg) return;
  status.innerText = '✅ বানানো হচ্ছে...';
  ctx.clearRect(0,0,800,1000);
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,800,1000);
  // Center crop passport style
  ctx.drawImage(cutoutImg, 100, 20, 600, 800);
  const out = canvas.toDataURL('image/jpeg',0.95);
  result.src = out;
  result.style.display='block';
  document.getElementById('dl').href = out;
  document.getElementById('dlBtn').style.display='block';
  status.innerText='✅ রেডি! কালার বদলে আবার ডাউনলোড করতে পারো';
}
document.getElementById('b1').classList.add('active');
</script>
</body>
</html>
