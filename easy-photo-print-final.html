<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Maker - 3 Background</title>
<style>
*{box-sizing:border-box}
body{margin:0; background:#111; color:#fff; font-family:system-ui; padding:12px}
.app{max-width:430px; margin:auto; background:#1e1e1e; border-radius:20px; padding:18px}
h2{text-align:center}
.upload{border:2px dashed #666; border-radius:15px; padding:25px; text-align:center; background:#252525}
input{display:none}
.btn{width:100%; padding:15px; border:none; border-radius:12px; font-weight:700; font-size:17px; margin-top:12px}
.white{background:#fff; color:#000}
.lb{background:#a3d5ff; color:#000}
.blue{background:#1976d2; color:#fff}
.black{background:#fff; color:#000; margin-top:15px}
.green{background:#00ff88; color:#000; display:none}
#preview,#result{width:100%; border-radius:15px; margin-top:15px; display:none; background:#fff}
#status{text-align:center; color:#00ff88; margin-top:10px; font-size:14px}
.bg-options{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px}
.bg-options button{padding:12px; border-radius:10px; border:1px solid #444; font-weight:700}
</style>
</head>
<body>
<div class="app">
<h2>📸 পাসপোর্ট মেকার PRO</h2>
<div class="upload" onclick="document.getElementById('file').click()">
<div style="font-size:40px">👆</div>
<p>ছবিতে টাচ করে গ্যালারি থেকে ছবি নাও</p>
<img id="preview">
</div>
<input type="file" id="file" accept="image/*">

<div class="bg-options">
<button class="white" onclick="changeBg('white')">⬜ সাদা</button>
<button class="lb" onclick="changeBg('#a3d5ff')">🟦 হালকা ব্লু</button>
<button class="blue" onclick="changeBg('#1976d2')">🟦 ব্লু</button>
</div>

<button class="btn black" id="autoBtn">✨ অটো পাসপোর্ট বানাও (HD + ক্লিয়ার)</button>

<canvas id="canvas" style="display:none"></canvas>
<img id="result">
<a id="download"><button class="btn green" id="dlBtn">⬇️ ডাউনলোড করো</button></a>
<div id="status">ছবি সিলেক্ট করো</div>
</div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.mjs";
let originalFile=null, bgColor="#ffffff", lastImg=null;
const fileInput=document.getElementById('file'), preview=document.getElementById('preview');
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const result=document.getElementById('result'), status=document.getElementById('status');
const dlBtn=document.getElementById('dlBtn'), download=document.getElementById('download');

fileInput.onchange=e=>{
  originalFile=e.target.files[0];
  preview.src=URL.createObjectURL(originalFile);
  preview.style.display="block";
  status.innerText="ছবি লোড হয়েছে, এখন অটো বাটনে ক্লিক করো";
}

window.changeBg=c=>{
  bgColor=c;
  if(lastImg) render(lastImg);
}

document.getElementById('autoBtn').onclick=async()=>{
  if(!originalFile) return alert("আগে ছবি সিলেক্ট করো");
  status.innerText="⏳ ব্যাকগ্রাউন্ড রিমুভ + HD হচ্ছে... 15 সেকেন্ড";
  try{
    const blob=await removeBackground(originalFile);
    let img=new Image();
    img.src=URL.createObjectURL(blob);
    img.onload=()=>{
      lastImg=img;
      render(img);
      status.innerText="✅ রেডি! নিচে ৩ টে ব্যাকগ্রাউন্ড ট্রাই করতে পারো";
      dlBtn.style.display="block";
    }
  }catch(e){status.innerText="Error: "+e.message}
}

function render(img){
  canvas.width=800; canvas.height=1000;
  ctx.fillStyle=bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // HD + চোখের কালি হালকা ফিল্টার
  ctx.filter="contrast(1.15) brightness(1.07) saturate(1.03)";
  ctx.drawImage(img, 100, 40, 600, 850);
  let url=canvas.toDataURL("image/jpeg",0.96);
  result.src=url; result.style.display="block";
  download.href=url;
  download.download=`passport_${bgColor.replace('#','')}_${Date.now()}.jpg`;
}
</script>
</body>
</html>
