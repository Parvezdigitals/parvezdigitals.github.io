#pdToolModal .pd-box{background:#fff9e6;border:2px solid #0a1f1a;border-radius:18px;box-shadow:5px 5px 0 #0a1f1a;width:min(760px,100%);max-height:94vh;overflow:auto;padding:16px}
#pdToolModal .pd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #c9d1ca;padding-bottom:10px;margin-bottom:12px}
#pdToolModal h2{font-size:20px;font-weight:900}
#pdToolModal label{font-size:13px;font-weight:750;display:block;margin:8px 0 4px}
#pdToolModal input:not([type=file]):not([type=range]),#pdToolModal select,#pdToolModal textarea{width:100%;border:1.5px solid #0a1f1a;border-radius:9px;background:#fff;padding:9px;color:#0a1f1a}
#pdToolModal input[type=file]{display:block;width:100%;padding:10px;border:1px dashed #0f4c40;border-radius:10px;background:#fff;margin:8px 0}
#pdToolModal .pd-btn{border:1.5px solid #0a1f1a;border-radius:999px;padding:10px 14px;font-weight:800;font-size:13px;background:#0f4c40;color:#fff;margin:4px 3px 4px 0}
#pdToolModal .pd-btn.secondary{background:#fff;color:#0a1f1a}
#pdToolModal .pd-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#pdToolModal .pd-note{font-size:12px;color:#555;margin:8px 0;line-height:1.5}
#pdToolModal .pd-preview{max-width:100%;max-height:300px;object-fit:contain;border:1px solid #0f4c40;border-radius:10px;margin:10px auto;background:#fff}
#pdToolModal .pd-status{font-size:12px;font-weight:750;background:#e6f2eb;border-radius:8px;padding:9px;margin:8px 0}
#pdToolModal .pd-quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid #0a1f1a;border-radius:9px;background:#fff;color:#0a1f1a}
@media(max-width:520px){#pdToolModal .pd-row{grid-template-columns:1fr}#pdToolModal .pd-box{padding:12px}#pdToolModal h2{font-size:18px}}
</style>
<div id="pdToolModal" role="dialog" aria-modal="true" aria-labelledby="pdToolTitle">
 <div class="pd-box">
  <div class="pd-head"><div><div style="font-size:10px;font-weight:900;letter-spacing:.15em;color:#0f4c40">PARVEZ DIGITAL</div><h2 id="pdToolTitle">Photo Tool</h2></div><button class="pd-btn secondary" type="button" onclick="window.closeParvezTool()">✕ Close</button></div>
  <div id="pdToolBody"></div>
 </div>
</div>
<script>
(function(){
"use strict";
const modal=document.getElementById('pdToolModal'), body=document.getElementById('pdToolBody'), title=document.getElementById('pdToolTitle');
let activeTool='', sourceFile=null, sourceImage=null, processedBlob=null, processedUrl='', outputCanvas=null, backgroundColor='#ffffff', brightness=100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.closeParvezTool=function(){modal.style.display='none';body.innerHTML='';if(processedUrl){URL.revokeObjectURL(processedUrl);processedUrl=''}};
modal.addEventListener('click',e=>{if(e.target===modal)window.closeParvezTool()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.style.display==='flex')window.closeParvezTool()});
const photoNames=['4x6 Photo','A4 Photo','Crop Resize','Passport Photo','Passport Photo Maker','Photo Crop','Photo Resize'];
window.openParvezTool=function(name){
 activeTool=name; sourceFile=null;sourceImage=null;processedBlob=null;outputCanvas=null;backgroundColor='#ffffff';brightness=100;
 title.textContent=name; modal.style.display='flex';
 if(photoNames.includes(name)){renderPhotoTool(name);return}
 if(name==='ID Card Print'){renderIdCard();return}
 if(name==='QR Lock'){renderQR();return}
 if(name==='Resume Maker'){renderResume();return}
 if(name==='Mock Test'){renderQuiz();return}
 body.innerHTML='<p class="pd-note">এই টুলটি পাওয়া যায়নি। Photo & Other Tools মেনু থেকে আবার নির্বাচন করুন।</p>';
};
function renderPhotoTool(name){
 const isA4=name==='A4 Photo', is4x6=name==='4x6 Photo', isPassport=/passport/i.test(name), isCrop=/crop/i.test(name);
 body.innerHTML=`
 <p class="pd-note">ছবি আপনার ডিভাইসেই প্রসেস হবে। AI Background Remove-এর জন্য ইন্টারনেট লাগবে।</p>
 <label for="pdPhotoFile">ছবি Upload (Gallery / Camera)</label><input id="pdPhotoFile" type="file" accept="image/*" capture="environment">
 <div class="pd-row">
  <div><label for="pdSize">Output size</label><select id="pdSize">
   <option value="passport" ${isPassport?'selected':''}>Passport 35 × 45 mm</option><option value="2x2">2 × 2 inch</option><option value="4x6" ${is4x6?'selected':''}>4 × 6 inch photo</option><option value="a4" ${isA4?'selected':''}>A4 photo sheet</option><option value="crop" ${isCrop?'selected':''}>Crop / Resize 600 × 800</option><option value="custom">Custom size</option>
  </select></div>
  <div><label for="pdBg">Background</label><select id="pdBg"><option value="#ffffff">White</option><option value="#1d4ed8">Blue</option><option value="#87ceeb">Light Sky Blue</option><option value="transparent">Transparent (PNG)</option></select></div>
 </div>
 <div class="pd-row"><div><label for="pdW">Custom width (px)</label><input id="pdW" type="number" min="50" max="5000" value="600"></div><div><label for="pdH">Custom height (px)</label><input id="pdH" type="number" min="50" max="7000" value="800"></div></div>
 <label for="pdBright">Brightness: <span id="pdBrightLabel">100%</span></label><input id="pdBright" type="range" min="60" max="150" value="100" style="width:100%">
 <div><button class="pd-btn" id="pdRemoveBg" type="button">AI Background Remove</button><button class="pd-btn secondary" id="pdAutoCrop" type="button">Auto Face Crop</button><button class="pd-btn secondary" id="pdMake" type="button">Create Photo</button></div>
 <div id="pdPhotoStatus" class="pd-status" role="status">প্রথমে ছবি Upload করুন।</div><img id="pdPhotoPreview" class="pd-preview" alt="Uploaded photo preview" style="display:none"><canvas id="pdPhotoCanvas" style="display:none;max-width:100%;max-height:400px;margin:10px auto;border:1px solid #0f4c40"></canvas>
 <div><button class="pd-btn" id="pdDownloadJpg" type="button" disabled>Download JPG</button><button class="pd-btn secondary" id="pdDownloadPng" type="button" disabled>Download PNG</button><button class="pd-btn secondary" id="pdPrintPhoto" type="button" disabled>Print</button></div>
 <p class="pd-note">নোট: Auto Face Crop ব্রাউজারের FaceDetector API থাকলে মুখের অবস্থান ব্যবহার করবে; না থাকলে center crop ব্যবহার হবে। AI background removal-এর ফলাফল ইন্টারনেট, ডিভাইস ও মডেল লোডের উপর নির্ভরশীল।</p>`;
 const file=document.getElementById('pdPhotoFile'), preview=document.getElementById('pdPhotoPreview'), status=document.getElementById('pdPhotoStatus'), canvas=document.getElementById('pdPhotoCanvas');
 const setStatus=t=>status.textContent=t;
 file.onchange=()=>{
  const f=file.files&&file.files[0];if(!f)return;
  if(!f.type.startsWith('image/')){setStatus('সঠিক image file নির্বাচন করুন।');return}
  if(f.size>40*1024*1024){setStatus('ছবিটি 40 MB-এর বেশি। ছোট ফাইল নির্বাচন করুন।');return}
  sourceFile=f;processedBlob=null;outputCanvas=null;
  const u=URL.createObjectURL(f);preview.onload=()=>URL.revokeObjectURL(u);preview.src=u;preview.style.display='block';canvas.style.display='none';
  const im=new Image();im.onload=()=>{sourceImage=im;setStatus(`ছবি লোড হয়েছে: ${f.name} (${(f.size/1024).toFixed(1)} KB)`)};im.onerror=()=>setStatus('ছবি পড়া যায়নি; অন্য ছবি চেষ্টা করুন.');im.src=URL.createObjectURL(f);
 };
 document.getElementById('pdBg').onchange=e=>backgroundColor=e.target.value;
 document.getElementById('pdBright').oninput=e=>{brightness=+e.target.value;document.getElementById('pdBrightLabel').textContent=brightness+'%'};
 document.getElementById('pdRemoveBg').onclick=async()=>{
  if(!sourceFile){setStatus('আগে ছবি Upload করুন।');return}
  setStatus('AI Background Remove চলছে। প্রথমবার মডেল ডাউনলোড হতে সময় লাগতে পারে…');
  try{
   const mod=await import('https://esm.sh/@imgly/background-removal@1.5.5');
   const blob=await mod.removeBackground(sourceFile);
   const u=URL.createObjectURL(blob), im=new Image();
   await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=u});
   sourceImage=im;processedBlob=blob;preview.src=u;preview.style.display='block';setStatus('Background সরানো হয়েছে। পছন্দের background বেছে Create Photo চাপুন।');
  }catch(err){setStatus('AI Background Remove চালু হয়নি। ইন্টারনেট সংযোগ দিন, Chrome ব্যবহার করুন এবং আবার চেষ্টা করুন।');}
 };
 document.getElementById('pdAutoCrop').onclick=async()=>{
  if(!sourceImage){setStatus('আগে ছবি Upload করুন।');return}
  try{
   if('FaceDetector' in window){const fd=new FaceDetector({fastMode:true,maxDetectedFaces:1});const faces=await fd.detect(sourceImage);if(faces.length){window.__pdFace=faces[0].boundingBox;setStatus('মুখ শনাক্ত হয়েছে। Create Photo চাপুন।');return}}
   window.__pdFace=null;setStatus('Face Detection এই ব্রাউজারে উপলব্ধ নয়। Create Photo center crop ব্যবহার করবে।');
  }catch(e){window.__pdFace=null;setStatus('Face Detection পাওয়া যায়নি; center crop ব্যবহার করা হবে।')}
 };
 document.getElementById('pdMake').onclick=()=>{
  if(!sourceImage){setStatus('আগে ছবি Upload করুন।');return}
  let mode=document.getElementById('pdSize').value,w=600,h=800;
  if(mode==='passport'){w=413;h=531}else if(mode==='2x2'){w=600;h=600}else if(mode==='4x6'){w=1200;h=1800}else if(mode==='a4'){w=2480;h=3508}else if(mode==='custom'){w=Math.max(50,Math.min(5000,+document.getElementById('pdW').value||600));h=Math.max(50,Math.min(7000,+document.getElementById('pdH').value||800))}
  const sheet=mode==='a4', photoW=mode==='4x6'?1200:mode==='passport'?413:mode==='2x2'?600:mode==='crop'?600:w, photoH=mode==='4x6'?1800:mode==='passport'?531:mode==='2x2'?600:mode==='crop'?800:h;
  const out=document.createElement('canvas');out.width=sheet?2480:photoW;out.height=sheet?3508:photoH;const ctx=out.getContext('2d');
  if(backgroundColor!=='transparent'){ctx.fillStyle=backgroundColor;ctx.fillRect(0,0,out.width,out.height)}
  ctx.filter=`brightness(${brightness}%)`;
  const drawOne=(x,y,dw,dh)=>{
   const iw=sourceImage.naturalWidth||sourceImage.width,ih=sourceImage.naturalHeight||sourceImage.height,ratio=dw/dh;
   let sx=0,sy=0,sw=iw,sh=ih;
   if(window.__pdFace){const f=window.__pdFace;let cx=f.x+f.width/2,cy=f.y+f.height*.48;sh=Math.min(ih,iw/ratio);sw=sh*ratio;sx=Math.max(0,Math.min(iw-sw,cx-sw/2));sy=Math.max(0,Math.min(ih-sh,cy-sh*.42))}
   else if(iw/ih>ratio){sw=ih*ratio;sx=(iw-sw)/2}else{sh=iw/ratio;sy=(ih-sh)/2}
   ctx.drawImage(sourceImage,sx,sy,sw,sh,x,y,dw,dh);
  };
  if(sheet){const pw=413,ph=531,gap=35,startX=100,startY=100,cols=5,rows=5;for(let yy=0;yy<rows;yy++)for(let xx=0;xx<cols;xx++){let x=startX+xx*(pw+gap),y=startY+yy*(ph+gap);if(x+pw<out.width&&y+ph<out.height)drawOne(x,y,pw,ph)}}
  else drawOne(0,0,out.width,out.height);
  ctx.filter='none';outputCanvas=out;canvas.width=out.width;canvas.height=out.height;canvas.getContext('2d').drawImage(out,0,0);canvas.style.display='block';
  const saveButtons=['pdDownloadJpg','pdDownloadPng','pdPrintPhoto'];saveButtons.forEach(id=>document.getElementById(id).disabled=false);
  setStatus(`ছবি তৈরি হয়েছে: ${out.width} × ${out.height} px. এখন Download বা Print করুন।`);
 };
 function download(type){if(!outputCanvas)return;outputCanvas.toBlob(b=>{if(!b){setStatus('ফাইল তৈরি হয়নি। আবার চেষ্টা করুন।');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(activeTool||'photo').toLowerCase().replace(/[^a-z0-9]+/g,'-')+(type==='image/jpeg'?'.jpg':'.png');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},type,type==='image/jpeg'?.92:undefined)}
 document.getElementById('pdDownloadJpg').onclick=()=>download('image/jpeg');document.getElementById('pdDownloadPng').onclick=()=>download('image/png');
 document.getElementById('pdPrintPhoto').onclick=()=>{if(!outputCanvas)return;const win=window.open('','_blank');if(!win){setStatus('Print window blocked. Browser pop-up allow করুন।');return}win.document.write('<!doctype html><title>PARVEZ DIGITAL Photo Print</title><style>@page{margin:8mm}body{margin:0;text-align:center}img{max-width:100%;height:auto}</style><img src="'+outputCanvas.toDataURL('image/png')+'" onload="window.print()">');win.document.close()};
}
function renderIdCard(){
 body.innerHTML=`<p class="pd-note">নিজের ID card layout তৈরি করে print করুন। এখানে দেওয়া তথ্য আপনার ব্রাউজারে থাকে।</p><label>ছবি (ঐচ্ছিক)</label><input id="pdIdPhoto" type="file" accept="image/*"><label>নাম</label><input id="pdIdName" placeholder="Full name"><label>ID / Registration number</label><input id="pdIdNo" placeholder="ID number"><label>ঠিকানা / প্রতিষ্ঠান</label><textarea id="pdIdOrg" rows="2" placeholder="Address or organisation"></textarea><button class="pd-btn" id="pdIdPreview">Preview ID Card</button><button class="pd-btn secondary" id="pdIdPrint">Print ID Card</button><div id="pdIdCard" style="display:none;max-width:420px;margin:15px auto;padding:18px;border:2px solid #0f4c40;border-radius:12px;background:#fff;text-align:center"><img id="pdIdImg" style="width:80px;height:90px;object-fit:cover;margin:0 auto 8px"><h3 id="pdIdNameOut" style="font-weight:900"></h3><p id="pdIdNoOut"></p><p id="pdIdOrgOut"></p></div>`;
 document.getElementById('pdIdPhoto').onchange=e=>{let f=e.target.files[0];if(f){let im=document.getElementById('pdIdImg');im.src=URL.createObjectURL(f);im.style.display='block'}};
 document.getElementById('pdIdPreview').onclick=()=>{document.getElementById('pdIdNameOut').textContent=document.getElementById('pdIdName').value;document.getElementById('pdIdNoOut').textContent='ID: '+document.getElementById('pdIdNo').value;document.getElementById('pdIdOrgOut').textContent=document.getElementById('pdIdOrg').value;document.getElementById('pdIdCard').style.display='block'};
 document.getElementById('pdIdPrint').onclick=()=>{document.getElementById('pdIdPreview').click();setTimeout(()=>{const card=document.getElementById('pdIdCard').outerHTML;const w=window.open('','_blank');if(!w)return;w.document.write('<!doctype html><title>ID Card - PARVEZ DIGITAL</title><style>body{font-family:Arial;padding:20px}#pdIdCard{display:block!important;max-width:420px;margin:auto;padding:18px;border:2px solid #0f4c40;border-radius:12px;text-align:center}img{width:80px;height:90px;object-fit:cover}</style>'+card+'<script>window.onload=()=>window.print()<\\/script>');w.document.close()},150)};
}
function renderQR(){
 body.innerHTML=`<p class="pd-note">QR code তৈরি করতে ইন্টারনেট প্রয়োজন; লেখা/URL QR provider-এ পাঠানো হবে। গোপন তথ্য লিখবেন না।</p><label>Text বা URL</label><textarea id="pdQrText" rows="3" placeholder="https://example.com"></textarea><label>QR size</label><select id="pdQrSize"><option>200</option><option selected>300</option><option>500</option><option>800</option></select><button class="pd-btn" id="pdQrMake">Generate QR</button><div id="pdQrResult"></div>`;
 document.getElementById('pdQrMake').onclick=()=>{let val=document.getElementById('pdQrText').value.trim(),size=document.getElementById('pdQrSize').value,res=document.getElementById('pdQrResult');if(!val){res.innerHTML='<p class="pd-note">প্রথমে text বা URL লিখুন।</p>';return}const url='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(val);res.innerHTML='<img class="pd-preview" alt="Generated QR code" src="'+url+'"><p><a class="pd-btn" style="display:inline-block;text-decoration:none" href="'+url+'" download="parvez-digital-qr.png" target="_blank" rel="noopener">Open / Download QR</a></p>'};
}
function renderResume(){
 body.innerHTML=`<p class="pd-note">Resume তৈরি করুন; Print থেকে PDF-এ Save করতে পারবেন।</p><label>Full name</label><input id="pdCvName" placeholder="Your name"><label>Phone / Email</label><input id="pdCvContact" placeholder="Phone, email"><label>Career objective</label><textarea id="pdCvObjective" rows="3" placeholder="Career objective"></textarea><label>Education</label><textarea id="pdCvEducation" rows="3" placeholder="Qualification, institution, year"></textarea><label>Skills</label><textarea id="pdCvSkills" rows="3" placeholder="Skills"></textarea><label>Experience</label><textarea id="pdCvExperience" rows="3" placeholder="Work experience (optional)"></textarea><button class="pd-btn" id="pdCvPreview">Generate Resume</button><button class="pd-btn secondary" id="pdCvPrint">Print / Save as PDF</button><div id="pdCvOutput" style="display:none;background:#fff;padding:20px;margin-top:12px;border:1px solid #aaa;color:#111"></div>`;
 const generate=()=>{const get=id=>document.getElementById(id).value;document.getElementById('pdCvOutput').innerHTML='<h1 style="font-size:24px;font-weight:bold">'+esc(get('pdCvName'))+'</h1><p>'+esc(get('pdCvContact'))+'</p><hr><h3>CAREER OBJECTIVE</h3><p>'+esc(get('pdCvObjective')).replace(/\n/g,'<br>')+'</p><h3>EDUCATION</h3><p>'+esc(get('pdCvEducation')).replace(/\n/g,'<br>')+'</p><h3>SKILLS</h3><p>'+esc(get('pdCvSkills')).replace(/\n/g,'<br>')+'</p><h3>EXPERIENCE</h3><p>'+esc(get('pdCvExperience')).replace(/\n/g,'<br>')+'</p>';document.getElementById('pdCvOutput').style.display='block'};
 document.getElementById('pdCvPreview').onclick=generate;document.getElementById('pdCvPrint').onclick=()=>{generate();setTimeout(()=>{const cv=document.getElementById('pdCvOutput').innerHTML;const w=window.open('','_blank');if(!w)return;w.document.write('<!doctype html><title>Resume - PARVEZ DIGITAL</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:30px auto;padding:20px;line-height:1.5;color:#111}h3{margin-top:20px;border-bottom:1px solid #888;padding-bottom:4px}</style>'+cv+'<script>window.onload=()=>window.print()<\\/script>');w.document.close()},100)};
}
function renderQuiz(){
 const qs=[{q:'Which document is issued by UIDAI?',a:['PAN Card','Aadhaar','Voter ID'],c:1},{q:'Which file format is commonly used for documents?',a:['PDF','MP3','EXE'],c:0},{q:'Which key combination usually copies selected text?',a:['Ctrl + V','Ctrl + C','Ctrl + X'],c:1},{q:'What does URL identify?',a:['A web address','A photo size','A printer'],c:0},{q:'Which is a safe practice for official services?',a:['Share OTP with anyone','Use official website and never share OTP','Post password publicly'],c:1}];
 body.innerHTML='<p class="pd-note">৫টি সাধারণ ডিজিটাল সচেতনতা প্রশ্ন। এটি অনুশীলনমূলক, কোনো সরকারি পরীক্ষার official mock test নয়।</p><div id="pdQuiz" class="pd-quiz"></div><button class="pd-btn" id="pdQuizScore">Check Score</button><div id="pdQuizResult" class="pd-status" style="display:none"></div>';
 const qbox=document.getElementById('pdQuiz');qbox.innerHTML=qs.map((q,i)=>'<section style="margin:12px 0"><b>'+(i+1)+'. '+q.q+'</b>'+q.a.map((a,j)=>'<label style="font-weight:500"><input type="radio" name="pdq'+i+'" value="'+j+'"> '+a+'</label>').join('')+'</section>').join('');
 document.getElementById('pdQuizScore').onclick=()=>{let score=0;qs.forEach((q,i)=>{let v=document.querySelector('input[name="pdq'+i+'"]:checked');if(v&&+v.value===q.c)score++});const r=document.getElementById('pdQuizResult');r.style.display='block';r.textContent='Your score: '+score+' / '+qs.length};
}
})();
</script>

</body>
</html>
