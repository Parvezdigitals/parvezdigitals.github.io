<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Photo</title>
<style>
body { background: #F7F1DE; font-family: sans-serif; padding: 15px; text-align: center; }
h2 { color: #0F4C3D; }
input { margin: 15px 0; }
button { background: #0F4C40; color: white; border: none; padding: 14px 25px; font-size: 16px; border-radius: 30px; margin: 8px; font-weight: bold; }
#downloadBtn { background: #2e7d32; display: none; }
canvas { border: 2px solid #0A1F1A; margin-top: 15px; max-width: 100%; }
</style>
</head>
<body>

<h2>🛂 PASSPORT PHOTO</h2>
<p>PARVEZ DIGITAL</p>

<input type="file" id="photo" accept="image/*">
<br>
<button onclick="processPhoto()">প্রসেস করো</button>
<br>
<canvas id="canvas"></canvas>
<br>
<button id="downloadBtn" onclick="downloadPhoto()">⬇️ ডাউনলোড করো</button>

<script>
function processPhoto() {
  var file = document.getElementById('photo').files[0];
  if (!file) {
    alert('আগে একটা ফটো সিলেক্ট করো');
    return;
  }

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');

      // 35x45 mm size
      canvas.width = 413;
      canvas.height = 531;

      // White background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center crop
      var scale = Math.max(canvas.width / img.width, canvas.height / img.height);
      var w = canvas.width / scale;
      var h = canvas.height / scale;
      var x = (img.width - w) / 2;
      var y = (img.height - h) / 2;

      ctx.drawImage(img, x, y, w, h, 0, 0, canvas.width, canvas.height);

      document.getElementById('downloadBtn').style.display = 'inline-block';
      alert('সফল! এখন ডাউনলোড বাটন চাপো');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function downloadPhoto() {
  var canvas = document.getElementById('canvas');
  var link = document.createElement('a');
  link.download = 'passport-photo.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>

</body>
</html>
