<script>
(function(){
function addSideMenuClose(){
  document.querySelectorAll('div[style]').forEach(el=>{
    const s=el.getAttribute('style')||'';
    if(s.includes('position:fixed') && s.includes('top:0px') && s.includes('max-width:420px') && s.includes('z-index:9999')){
      if(el.querySelector('.parvez-side-close-extra')) return;
      const extra=document.createElement('div');
      extra.className='parvez-side-close-extra';
      extra.textContent='✕  Close Menu';
      extra.onclick=()=>{
        el.style.right='-100%';
        document.querySelectorAll('div[style]').forEach(o=>{
          const os=o.getAttribute('style')||'';
          if(os.includes('position:fixed') && os.includes('background:rgba(0,0,0,.6)')){try{o.click();}catch(e){}}
        });
      };
      el.appendChild(extra);
    }
  });
}
const obs=new MutationObserver(addSideMenuClose);
obs.observe(document.body,{childList:true,subtree:true});
setTimeout(addSideMenuClose,800);
})();
</script>

<script>
(function(){
function addLogo(){
  // Find header PA element
  document.querySelectorAll('div').forEach(el=>{
    const txt = el.textContent.trim();
    if(txt==='PA' && el.style && el.style.width==='36px'){
      // Replace with img
      el.innerHTML='<img src="./logo.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:8px" onerror="this.src='./logo.jpg'">';
      el.style.background='transparent';
    }
  });
  // Also for WB logo in GP application if exists
}
setTimeout(addLogo,1000);
setTimeout(addLogo,2500);
const obsLogo = new MutationObserver(addLogo);
obsLogo.observe(document.body,{childList:true,subtree:true});
})();
</script>

<script>
(function(){
function patchGP(){
  document.querySelectorAll('div').forEach(el=>{
    const s=el.getAttribute('style')||'';
    if(s.includes('cursor:pointer') && el.textContent.includes('GP Application')){
      el.onclick=()=>{window.open('./gp-fixed.html','_blank');};
    }
    if(s.includes('cursor:pointer') && el.textContent.includes('Gram Database')){
      el.onclick=()=>{window.open('./gp-fixed.html','_blank');};
    }
  });
}
setTimeout(patchGP,1500);
setInterval(patchGP,3000);
})();
