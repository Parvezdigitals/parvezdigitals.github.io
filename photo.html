<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto PVC - HD AI</title>
<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;padding:10px}
.box{max-width:430px;margin:auto;background:#1e293b;border:2px solid #38bdf8;border-radius:18px;padding:12px}
.sizes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sizes button{padding:8px 12px;border-radius:20px;border:1px solid #38bdf8;background:#0f172a;color:#fff;font-weight:700;font-size:12px}
.sizes button.active{background:#38bdf8;color:#000}
.bg{display:flex;gap:8px;justify-content:center;margin:10px 0}
.bg span{width:40px;height:40px;border-radius:50%;border:2px solid #fff;display:inline-block}
canvas{width:100%;background:#8AB4F8;border-radius:12px;display:block}
#msg{text-align:center;color:#fde047;font-weight:700;margin:8px;min-height:18px}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#7dd3fc;margin:5px">📸 Auto PVC - AI HD</h2>
<div class="sizes">
<button id="b1" class="active" onclick="setSize(600,800,'b1')">Passport 35x45</button>
<button id="b2" onclick="setSize(400,500,'b2')">Stamp</button>
<button id="b3" onclick="setSize(600,600,'b3')">Visa 51x51</button>
<button id="b4" onclick="setSize(900,1200,'b4')">HD 3x</button>
</div>
<input type="file" id="file" accept="image/*" style="width:100%;padding:10px;background:#fff;color:#000;border-radius:10px;margin:8px 0">
<div class="bg">
<span style="background:#8AB4F8" onclick="setBg('#8AB4F8')"></span>
<span style="background:#ffffff" onclick="setBg('#ffffff')"></span>
<span style="background:#ff0000" onclick="setBg('#ff0000')"></span>
<span style="background:#e5e7eb" onclick="setBg('#e5e7eb')"></span>
</div>
<p id="msg">ছবি বাছো - AI চুল সহ কাটবে + HD করবে</p>
<canvas id="c" width="600" height="800"></canvas>
<button onclick="downloadHD()" style="width:100%;padding:14px;background:#22c55e;border:0;border-radius:12px;font-weight:900;margin-top:10px">⬇️ HD Download</button>
</div>
<script>
let W=600,H=800,BG='#8AB4F8',cutImg=null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
function setSize(w,h,id){W=w;H=h;cv.width=w;cv.height=h;document.querySelectorAll('.sizes button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');draw()}
function setBg(c){BG=c;draw()}
function draw(){
 if(!cutImg){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);return}
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 // HD draw - keep hair details
 let s=Math.min(W*0.88/cutImg.width,H*0.88/cutImg.height);
 let nw=cutImg.width*s,nh=cutImg.height*s;
 ctx.drawImage(cutImg,(W-nw)/2,5,nw,nh);
 msg.innerText='✅ Final HD Ready - চুল ঠিক আছে';
}
document.getElementById('file').onchange=async e=>{
 let file=e.target.files[0];if(!file)return;
 msg.innerText='⏳ AI কাজ করছে... চুল সহ কাটছে, HD করছে... 10 সেকেন্ড';
 try{
  let blob=await ImglyBackgroundRemoval.removeBackground(file,{publicPath:'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/'});
  let url=URL.createObjectURL(blob);
  let im=new Image();
  im.onload=()=>{cutImg=im;draw();msg.innerText='✅ Background Remove + HD Done - চুল ঠিক আছে'};
  im.src=url;
 }catch(err){
  msg.innerText='⚠️ Net slow, তবুও HD করে দিলাম';
  let r=new FileReader();
  r.onload=ev=>{let im=new Image();im.onload=()=>{cutImg=im;draw()};im.src=ev.target.result}
  r.readAsDataURL(file);
 }
}
function downloadHD(){
 if(!cutImg){alert('Age chobi dao vai');return}
 let a=document.createElement('a');a.download='PVC-HD-'+W+'x'+H+'.jpg';a.href=cv.toDataURL('image/jpeg',0.97);a.click();
}
</script>
</body>
</html>
